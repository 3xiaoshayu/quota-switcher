name: 功能建议
description: 功能已齐。只谈本机账号、额度、切号上的真实缺口。
title: "[建议]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        2.0.6 已是当前定稿。请说清楚是 Codex、Cursor，还是两个都要用。只谈本机账号、额度、登录和切号上已经碰到的缺口，不谈加额度、自建云，或再加一家产品。

  - type: textarea
    id: problem
    attributes:
      label: 现在哪里别扭
      description: 谁在用，卡在哪一步。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 希望变成什么样
      description: 最小能用的一版，以及用完之后应该看到什么。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 现在怎么处理
      description: 没有这个功能时，你是怎么处理的。

  - type: textarea
    id: safety
    attributes:
      label: 会动到什么
      description: 会不会多存文件、多联网、后台多做事，或关掉官方客户端。

  - type: checkboxes
    id: existing
    attributes:
      label: 已查过
      options:
        - label: 我搜过已有 Issue，没有同一条建议。
          required: true
