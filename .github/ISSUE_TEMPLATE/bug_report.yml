name: Bug report
description: Report a reproducible problem in Codex Account Manager.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 0.1.0-beta.1
    validations:
      required: true
  - type: dropdown
    id: codex
    attributes:
      label: Codex install source
      options:
        - Microsoft Store official Codex
        - Other
        - Not sure
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove account tokens and private data before posting.

