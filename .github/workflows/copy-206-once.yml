name: copy-206-once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy published 2.0.6 assets from the archive repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p rel
          gh release download v2.0.6 --repo 3xiaoshayu/quota-switcher-history --dir rel
          ls -la rel
          cat > notes.md <<'EOF'
          额度刷新更稳：超时、代理 5xx、空的或 HTML 令牌响应、以及用量接口的 429 rate_limit，会显示「额度暂时没刷到，登录还在」，而不是要求重新授权或把额度标成用完。

          - 挂住的代理、截断的响应、反重力 Cloud Code 主机 500 会自动换路；尊重 Retry-After 和 x-ratelimit-reset 时长头。
          - 暂时没刷到时，原来的剩余额度仍留在卡片上。Codex 自动切号不会只因为一次 429 就离开当前号。
          - 账号数据仍只保存在本机。

          安装包尚未代码签名，Windows 可能提示「未知发布者」。请只从本仓库 Releases 下载，并用同一条 Release 中的 `SHA256SUMS.txt` 核对 SHA-256。

          这是当前定稿。完整记录见 [CHANGELOG.md](https://github.com/3xiaoshayu/quota-switcher/blob/main/CHANGELOG.md)。
          EOF
          sed -i 's/^          //' notes.md
          if gh release view v2.0.6 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release delete v2.0.6 --repo "${GITHUB_REPOSITORY}" --yes
          fi
          gh release create v2.0.6 \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Quota Switcher 2.0.6" \
            --notes-file notes.md \
            rel/latest.yml \
            rel/Quota-Switcher-2.0.6-x64.zip \
            rel/Quota-Switcher-Setup-2.0.6-x64.exe \
            rel/Quota-Switcher-Setup-2.0.6-x64.exe.blockmap \
            rel/SHA256SUMS.txt
