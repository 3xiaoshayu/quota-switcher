appId: com.3xiaoshayu.codex-account-manager
productName: Codex Account Manager
copyright: Copyright © 2026

# Ship only the languages the interface actually uses; the full Chromium
# locale set adds ~47 MB uncompressed.
electronLanguages:
  - zh-CN
  - en-US

directories:
  output: dist
  buildResources: resources

win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  icon: resources/icon.ico
  artifactName: "Codex-Account-Manager-${version}-${arch}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  # Per-user is the default. Elevation stays on so "all users" is a real
  # choice instead of a disabled control with English "must run as admin".
  # The folder page comes from resources/installer.nsh, not the builder one.
  allowElevation: true
  # Builder skips its own directory page on upgrades; resources/installer.nsh
  # adds one that still appears so the user can pick a folder.
  allowToChangeInstallationDirectory: false
  include: installer.nsh
  installerLanguages:
    - zh_CN
    - en_US
  language: 2052
  uninstallDisplayName: Codex Account Manager
  installerSidebar: installerSidebar.bmp
  uninstallerSidebar: installerSidebar.bmp
  installerHeader: installerHeader.bmp
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: "Codex-Account-Manager-Setup-${version}-${arch}.${ext}"

publish:
  provider: github
  owner: 3xiaoshayu
  repo: codex-account-manager

files:
  - src/**/*
  - engine/**/*
  - package.json
  - "!**/*.map"
  - "!src/renderer-react/**"
  - "!src/renderer/**"
